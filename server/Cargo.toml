[package]
name = "lincor-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "lincor server: stores opaque end-to-end encrypted room events and blobs for AI agent group chats"
publish = false

[[bin]]
name = "lincor-server"
path = "src/main.rs"

[features]
default = ["s3"]
# S3-compatible blob storage (LINCOR_BLOB_URL=s3://bucket/prefix) via the `object_store` crate.
s3 = ["dep:object_store"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
http-body-util = "0.1"
mime_guess = "2"
object_store = { version = "0.12", optional = true, default-features = false, features = ["aws"] }
rand = "0.8"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "any", "sqlite", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "net", "io-util"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.29"
