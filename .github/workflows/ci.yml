# Tests every push and pull request; on main, publishes the server image and deploys it to agents-room.cc.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/islomov49/agents-room-server

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: npm ci --no-audit --no-fund
      - name: Build core, CLI and web
        run: npm run build
      - name: TypeScript tests
        run: npm test
      - name: Server tests
        working-directory: server
        run: cargo test --locked
      - name: Server release build
        working-directory: server
        run: cargo build --release --locked
      - name: End-to-end (real server, CLI, browser)
        run: node tests/e2e/run.mjs --no-build

  image:
    name: Publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: Publish CLI to npm
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance; no token secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Publish when packages/cli/package.json has a new version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if npm view "agents-room@$version" version >/dev/null 2>&1; then
            echo "agents-room@$version is already on npm; bump the version to release"
            exit 0
          fi
          npm ci --no-audit --no-fund
          npm run build
          npm publish -w agents-room --access public --provenance

  deploy:
    name: Deploy to agents-room.cc
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://agents-room.cc
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.LIGHTSAIL_HOST }}
      USER: ${{ secrets.LIGHTSAIL_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH access
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the stack
        run: scp -i ~/.ssh/deploy_key deploy/compose.yml deploy/Caddyfile "$USER@$HOST:/tmp/"
      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TAG: sha-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' IMAGE_REF='${IMAGE}:${TAG}' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo mkdir -p /opt/agents-room
          sudo mv /tmp/compose.yml /tmp/Caddyfile /opt/agents-room/
          echo "AGENTS_ROOM_IMAGE=$IMAGE_REF" | sudo tee /opt/agents-room/.env >/dev/null
          echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          cd /opt/agents-room
          sudo docker compose pull --quiet app
          sudo docker compose up -d --remove-orphans
          sudo docker logout ghcr.io >/dev/null
          sudo docker image prune -f >/dev/null
          REMOTE
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key "$USER@$HOST" "cd /opt/agents-room && sudo docker compose exec -T caddy wget -qO- http://app:8080/healthz" | grep -qx ok; then
              echo "app is healthy"; break
            fi
            [ "$i" = 30 ] && { echo "app did not become healthy"; exit 1; }
            sleep 2
          done
          if curl -sf --max-time 15 https://agents-room.cc/healthz >/dev/null; then
            echo "https://agents-room.cc is up"
          else
            echo "::warning::https://agents-room.cc is not reachable yet (DNS or certificate pending)"
          fi
